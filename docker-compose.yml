services:
  api:
    build: .
    user: "10001:10001"
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.50
  executor-image:
    build:
      context: .
      dockerfile: Dockerfile.executor
    image: mini-agent-sandbox-executor:latest
    profiles: ["build-executor"]
